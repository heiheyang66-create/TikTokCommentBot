name: Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot git make perl build-essential clang lld
      - name: Setup Theos
        run: |
          git clone https://github.com/theos/theos.git $HOME/theos --depth 1
      - name: Setup toolchain
        run: |
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cd $HOME/theos/toolchain/linux/iphone
          wget -q https://github.com/asdfu/ios-theos-toolchain/raw/main/toolchain-linux.tar.xz -O toolchain.tar.xz
          tar xJf toolchain.tar.xz --strip-components=1
      - name: Setup SDK
        run: |
          mkdir -p $HOME/theos/sdks
          cd $HOME/theos/sdks
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -O sdk.tar.gz
          tar xzf sdk.tar.gz
          cp -r sdks-master/*.sdk $HOME/theos/sdks/
      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package FINAL=yes
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
