name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zhubofei/theos-action@v1
      - run: make package FINAL=yes
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
